# TruthOracle - Canton Network DAML contracts
# Prediction market platform for Canton Network testnet

# Keep on the latest stable release (`curl -sS https://get.digitalasset.com/install/latest`); the
# Cantor8 participants run Canton 3.5.x. Bumping it changes the package id — re-record it in
# DEPLOYMENT.md. CI (.github/workflows/ci.yml) warns when a newer release exists.
sdk-version: "3.5.12"
# Breaking changes bump the package *NAME* (truthoracle -> v5 -> ... -> v15 -> v16):
# Canton's smart-contract-upgrade (SCU) check rejects a schema-incompatible DAR
# uploaded under an existing package name, so a new schema needs a new name.
# v16: presentation leaves the contract. PredictionMarket and MarketCounter.CreateMarket
# no longer carry imageUrl / description / category — no choice reads them, no trader
# signs for them, and they must stay editable — so the backend catalog owns them
# (truthoracle-backend docs/MARKETS.md "What lives where"). Kept from v15: the catalog
# identity ticker / eventTicker / yesSubTitle / noSubTitle as mandatory, non-empty Text,
# and the v14 accounts-era rules (UserWallet created only by the backend treasury,
# depositRefs a mandatory [Text]). Deployed from scratch: no upgrade path from v15.
name: truthoracle-v16
version: 1.0.0
source: daml
# Templates only. The script suite lives in ./test (its own package, see multi-package.yaml) so the
# DAR uploaded to the participant carries no daml-script and no test code.
dependencies:
  - daml-prim
  - daml-stdlib
