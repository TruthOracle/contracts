# TruthOracle - Canton Network DAML contracts
# Prediction market platform for Canton Network testnet

sdk-version: "3.4.10"
# Breaking changes bump the package *NAME* (truthoracle -> v5 -> ... -> v13 -> v14):
# Canton's smart-contract-upgrade (SCU) check rejects a schema-incompatible DAR
# uploaded under an existing package name, so a new schema needs a new name.
# v14: greenfield accounts era - no upgrade path from v13. UserWallet is created only
# by the backend treasury for an account's primary wallet, and UserWallet.depositRefs
# (credited txRefs, newest first) is a mandatory [Text].
name: truthoracle-v14
version: 1.0.0
source: daml
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
